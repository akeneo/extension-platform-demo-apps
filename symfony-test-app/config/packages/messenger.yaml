framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(QUEUE_DSN)%'
                options:
                    # Reuse one AMQP connection per PHP-FPM worker instead of a fresh
                    # TCP+handshake per request, and skip re-declaring topology that
                    # already exists on every publish.
                    persistent: 'true'
                    auto_setup: false
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
            failed:
                dsn: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            App\Message\ProductUpdatedMessage: async
            App\Message\ProductSyncMessage: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
